<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="16" fill="#fff"/>
  <text x="500" y="38" font-size="19" text-anchor="middle" fill="#222">Calls per second for appending one entry to an array (higher is better, log scale)</text>
  <g stroke="#ddd" stroke-width="1">
    <line x1="220" y1="60" x2="220" y2="320"/><line x1="340" y1="60" x2="340" y2="320"/><line x1="460" y1="60" x2="460" y2="320"/><line x1="580" y1="60" x2="580" y2="320"/><line x1="700" y1="60" x2="700" y2="320"/><line x1="820" y1="60" x2="820" y2="320"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#555">
    <text x="220" y="342">100</text><text x="340" y="342">1,000</text><text x="460" y="342">10,000</text><text x="580" y="342">100,000</text><text x="700" y="342">1,000,000</text><text x="820" y="342">10,000,000</text>
  </g>
  <g font-size="17" text-anchor="end" fill="#222">
    <text x="205" y="107">10 entries</text><text x="205" y="197">1,000 entries</text><text x="205" y="287">100,000 entries</text>
  </g>
  <g fill="#9aa5b1">
    <rect x="220" y="72" width="528" height="26"/><rect x="220" y="162" width="337" height="26"/><rect x="220" y="252" width="87" height="26"/>
  </g>
  <g fill="#007d9c">
    <rect x="220" y="102" width="581" height="26"/><rect x="220" y="192" width="582" height="26"/><rect x="220" y="282" width="581" height="26"/>
  </g>
  <g font-size="15" fill="#222">
    <text x="756" y="91">2,520,000</text><text x="565" y="181">63,800</text><text x="315" y="271">534</text>
    <text x="809" y="121">7,000,000</text><text x="810" y="211">7,100,000</text><text x="809" y="301">6,970,000</text>
  </g>
  <rect x="330" y="364" width="18" height="18" fill="#9aa5b1"/><text x="356" y="379" font-size="16" fill="#222">Record (pass a slice)</text>
  <rect x="580" y="364" width="18" height="18" fill="#007d9c"/><text x="606" y="379" font-size="16" fill="#222">Handle.Record (pass a handle)</text>
</svg>
