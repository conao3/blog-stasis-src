<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Noto Sans JP, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" rx="16" fill="#ffffff"/>
<text x="20" y="52" font-size="22" font-weight="bold" fill="#d9622b">Reference workflow (every day at 12:00 UTC)</text>
<rect x="20" y="80" width="280" height="110" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="160" y="112" font-size="19" text-anchor="middle" fill="#222">Is the latest AWS CLI tag</text>
<text x="160" y="142" font-size="19" text-anchor="middle" fill="#222">newer than</text>
<text x="160" y="172" font-size="19" text-anchor="middle" fill="#222">models/VERSION?</text>
<rect x="340" y="80" width="280" height="110" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="480" y="112" font-size="19" text-anchor="middle" fill="#222">update-reference.sh</text>
<text x="480" y="142" font-size="19" text-anchor="middle" fill="#222">regenerates the models</text>
<text x="480" y="172" font-size="19" text-anchor="middle" fill="#222">and expected values</text>
<rect x="660" y="80" width="420" height="210" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="870" y="118" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Compare with the AWS CLI</text>
<text x="680" y="158" font-size="19" fill="#222">• make check</text>
<text x="680" y="190" font-size="19" fill="#222">• Differential tests of the changed services</text>
<text x="680" y="222" font-size="19" fill="#222">• Help pages of those services</text>
<text x="680" y="254" font-size="19" fill="#222">• Scenario and authentication comparison</text>
<line x1="300" y1="135" x2="338" y2="135" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="620" y1="135" x2="658" y2="135" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="660" y="340" width="420" height="110" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="870" y="387" font-size="19" text-anchor="middle" fill="#222">Open a PR</text>
<text x="870" y="417" font-size="19" text-anchor="middle" fill="#222">draft if a check fails or code needs porting</text>
<line x1="870" y1="290" x2="870" y2="338" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="330" font-size="22" font-weight="bold" fill="#555">After the PR is opened (by hand)</text>
<rect x="340" y="340" width="280" height="110" rx="10" fill="#ececec" stroke="#888" stroke-width="2"/>
<text x="480" y="387" font-size="19" text-anchor="middle" fill="#222">Read the changelog entries</text>
<text x="480" y="417" font-size="19" text-anchor="middle" fill="#222">and add porting commits</text>
<rect x="20" y="340" width="280" height="110" rx="10" fill="#ececec" stroke="#888" stroke-width="2"/>
<text x="160" y="387" font-size="19" text-anchor="middle" fill="#222">Merge the PR after</text>
<text x="160" y="417" font-size="19" text-anchor="middle" fill="#222">all comparisons pass</text>
<line x1="660" y1="395" x2="622" y2="395" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="340" y1="395" x2="302" y2="395" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="510" font-size="19" fill="#555">If a version needs no porting, the workflow merges the PR and starts Release once the comparisons pass</text>
</svg>
