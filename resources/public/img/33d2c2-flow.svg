  <text x="415" y="244" font-size="19" fill="#333" text-anchor="middle">PFML3 を組む</text>
  <rect x="560" y="170" width="210" height="110" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="665" y="212" font-size="19" fill="#333" text-anchor="middle">llama.cpp で</text>
  <text x="665" y="244" font-size="19" fill="#333" text-anchor="middle">訳文を生成</text>
  <line x1="520" y1="225" x2="556" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="850" y="150" width="200" height="120" rx="12" fill="#eef8f1" stroke="#4f9a68"/>
  <text x="950" y="200" font-size="21" font-weight="bold" fill="#333" text-anchor="middle">訳文</text>
