<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="400" rx="16" fill="#fff"/>
  <rect x="30" y="150" width="200" height="120" rx="12" fill="#eef3fb" stroke="#5b7fb8"/>
  <text x="130" y="200" font-size="21" font-weight="bold" fill="#333" text-anchor="middle">原文</text>
  <text x="130" y="234" font-size="19" fill="#333" text-anchor="middle">--text / 標準入力</text>
  <rect x="290" y="110" width="500" height="200" rx="12" fill="#f4f6f8" stroke="#8a96a3" stroke-dasharray="6 4"/>
  <text x="310" y="146" font-size="21" font-weight="bold" fill="#333">plamo-tr-local (手元の PC)</text>
  <rect x="310" y="170" width="210" height="110" rx="10" fill="#fff" stroke="#8a96a3"/>
