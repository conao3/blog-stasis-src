  <line x1="230" y1="210" x2="286" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="210" x2="846" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="20" width="410" height="60" rx="10" fill="#fdf5e8" stroke="#c48a2c"/>
  <text x="665" y="58" font-size="19" fill="#333" text-anchor="middle">Hugging Face (GGUF Q4_K_M)</text>
