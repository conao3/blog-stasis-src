<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="8" fill="#fff"/>
  <rect x="30" y="20" width="210" height="40" rx="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="42" y="47" fill="#d63a22">refs/A/s1xaaayz</text>
  <text x="270" y="47" fill="#555">state 1, a = 3, b = 0</text>
  <path d="M80,60 V168" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="104" y="92" font-weight="bold">1st fetch from self</text>
  <text x="104" y="120" fill="#555">the rule +refs/A/s1xa*:refs/B/s2x* writes the next name,</text>
  <text x="104" y="148" fill="#555">and prune deletes refs/A/s1xaaayz</text>
  <rect x="30" y="170" width="210" height="40" rx="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="42" y="197" fill="#d63a22">refs/B/s2xaayz</text>
  <text x="270" y="197" fill="#555">state 2, a = 2, b = 0</text>
  <path d="M80,210 V318" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="104" y="242" font-weight="bold">2nd fetch from self</text>
  <text x="104" y="270" fill="#555">the rule +refs/B/*:refs/A/* copies it back,</text>
  <text x="104" y="298" fill="#555">and prune deletes refs/B/s2xaayz</text>
  <rect x="30" y="320" width="210" height="40" rx="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="42" y="347" fill="#d63a22">refs/A/s2xaayz</text>
  <text x="270" y="347" fill="#555">state 2, a = 2, b = 0</text>
</svg>
