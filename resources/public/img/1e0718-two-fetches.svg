<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 294" width="560" height="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="560" height="294" rx="8" fill="#fff"/>
  <rect x="30" y="20" width="190" height="34" rx="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="42" y="42" fill="#d63a22">refs/A/s1xaaayz</text>
  <text x="240" y="42" fill="#666" font-size="13">state 1, a = 3, b = 0</text>
  <path d="M80,54 V128" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="78" font-size="13" font-weight="bold">1st fetch from self</text>
  <text x="100" y="96" font-size="13" fill="#666">the rule +refs/A/s1xa*:refs/B/s2x* writes the next name,</text>
  <text x="100" y="114" font-size="13" fill="#666">and prune deletes refs/A/s1xaaayz</text>
  <rect x="30" y="130" width="190" height="34" rx="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="42" y="152" fill="#d63a22">refs/B/s2xaayz</text>
  <text x="240" y="152" fill="#666" font-size="13">state 2, a = 2, b = 0</text>
  <path d="M80,164 V238" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="188" font-size="13" font-weight="bold">2nd fetch from self</text>
  <text x="100" y="206" font-size="13" fill="#666">the rule +refs/B/*:refs/A/* copies it back,</text>
  <text x="100" y="224" font-size="13" fill="#666">and prune deletes refs/B/s2xaayz</text>
  <rect x="30" y="240" width="190" height="34" rx="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="42" y="262" fill="#d63a22">refs/A/s2xaayz</text>
  <text x="240" y="262" fill="#666" font-size="13">state 2, a = 2, b = 0</text>
</svg>
