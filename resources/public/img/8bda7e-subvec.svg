<text x="30" y="106" font-size="16" fill="#222" text-anchor="start">元の v</text>
<rect x="204" y="70" width="82" height="54" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<text x="245.0" y="105" font-size="18" fill="#222" text-anchor="middle">0</text>
<rect x="294" y="70" width="82" height="54" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<text x="335.0" y="105" font-size="18" fill="#222" text-anchor="middle">1</text>
<rect x="384" y="70" width="82" height="54" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="425.0" y="105" font-size="18" fill="#222" text-anchor="middle">2</text>
<rect x="474" y="70" width="82" height="54" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="515.0" y="105" font-size="18" fill="#222" text-anchor="middle">3</text>
<rect x="564" y="70" width="82" height="54" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<text x="605.0" y="105" font-size="18" fill="#222" text-anchor="middle">4</text>
<path d="M384,136 v12 H556 v-12" fill="none" stroke="#0f4c81" stroke-width="2"/>
<text x="470.0" y="172" font-size="15" fill="#0f4c81" text-anchor="middle" font-weight="bold">(subvec v 2 4) = [2 3]</text>
<text x="335.0" y="200" font-size="15" fill="#a0410d" text-anchor="middle" font-weight="bold">-1</text>
<text x="425.0" y="200" font-size="15" fill="#0f4c81" text-anchor="middle">0</text>
<text x="515.0" y="200" font-size="15" fill="#0f4c81" text-anchor="middle">1</text>
<text x="30" y="200" font-size="14" fill="#666" text-anchor="start">subvec の添字</text>
<line x1="335.0" y1="212" x2="335.0" y2="262" stroke="#a0410d" stroke-width="1.8" marker-end="url(#ahr)"/>
<text x="349.0" y="244" font-size="15" fill="#a0410d" text-anchor="start">(assoc s -1 :x) は start + (-1) = 1 を書き換える</text>
<text x="30" y="302" font-size="16" fill="#222" text-anchor="start">返る subvec の v</text>
<rect x="204" y="266" width="82" height="54" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<text x="245.0" y="301" font-size="18" fill="#222" text-anchor="middle">0</text>
<rect x="294" y="266" width="82" height="54" rx="6" fill="#fde2d2" stroke="#a0410d" stroke-width="2"/>
<text x="335.0" y="301" font-size="18" fill="#a0410d" text-anchor="middle" font-weight="bold">:x</text>
<rect x="384" y="266" width="82" height="54" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="425.0" y="301" font-size="18" fill="#222" text-anchor="middle">2</text>
<rect x="474" y="266" width="82" height="54" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
