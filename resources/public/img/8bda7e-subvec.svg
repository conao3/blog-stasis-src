<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0410d"/></marker></defs>
<rect x="0" y="0" width="900" height="400" rx="16" fill="#fff"/>
<text x="245.0" y="58" font-size="14" fill="#666" text-anchor="middle">0</text>
<text x="335.0" y="58" font-size="14" fill="#666" text-anchor="middle">1</text>
<text x="425.0" y="58" font-size="14" fill="#666" text-anchor="middle">2</text>
<text x="515.0" y="58" font-size="14" fill="#666" text-anchor="middle">3</text>
<text x="605.0" y="58" font-size="14" fill="#666" text-anchor="middle">4</text>
