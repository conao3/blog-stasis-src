<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How a vow-defun body stops at vow-await and resumes</title>
  <desc id="desc">The caller calls my-versions, and the body runs to the first vow-await and returns a vow. Each time the git --version or emacs --version process exits, a timer from the job queue advances the body to the next vow-await. When the body ends, the returned vow is fulfilled and the caller's handler runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="380" rx="16" fill="#fff"/>
  <g font-size="20" font-weight="bold" fill="#333">
    <text x="30" y="85">Caller</text>
    <text x="30" y="195">Body</text>
    <text x="30" y="305">Job queue</text>
  </g>
  <g stroke="#c5ccd6" stroke-width="2" stroke-dasharray="6 6">
    <line x1="170" y1="78" x2="970" y2="78"/>
    <line x1="170" y1="188" x2="970" y2="188"/>
    <line x1="170" y1="298" x2="970" y2="298"/>
  </g>
  <rect x="170" y="62" width="40" height="32" rx="6" fill="#e8eef7" stroke="#0f4c81" stroke-width="2"/>
  <rect x="420" y="62" width="380" height="32" rx="6" fill="#f2f4f7" stroke="#687585" stroke-width="2"/>
  <rect x="870" y="62" width="100" height="32" rx="6" fill="#e8eef7" stroke="#0f4c81" stroke-width="2"/>
  <rect x="200" y="172" width="200" height="32" rx="6" fill="#e3f4f8" stroke="#007d9c" stroke-width="2"/>
  <rect x="480" y="172" width="200" height="32" rx="6" fill="#e3f4f8" stroke="#007d9c" stroke-width="2"/>
  <rect x="740" y="172" width="110" height="32" rx="6" fill="#e3f4f8" stroke="#007d9c" stroke-width="2"/>
  <rect x="440" y="282" width="40" height="32" rx="6" fill="#fdf1e3" stroke="#b5651d" stroke-width="2"/>
  <rect x="700" y="282" width="40" height="32" rx="6" fill="#fdf1e3" stroke="#b5651d" stroke-width="2"/>
  <g stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="195" y1="94" x2="215" y2="170"/>
    <line x1="400" y1="172" x2="425" y2="96"/>
    <line x1="470" y1="282" x2="495" y2="206"/>
    <line x1="730" y1="282" x2="755" y2="206"/>
    <line x1="850" y1="172" x2="880" y2="96"/>
  </g>
  <g font-size="17" fill="#222">
    <text x="610" y="84" text-anchor="middle">Other commands and input run</text>
    <text x="920" y="84" text-anchor="middle">Handler</text>
    <text x="300" y="194" text-anchor="middle">To the 1st vow-await</text>
    <text x="580" y="194" text-anchor="middle">To the 2nd vow-await</text>
    <text x="795" y="194" text-anchor="middle">To the end</text>
    <text x="215" y="136">Call</text>
    <text x="420" y="136">Returns a vow</text>
    <text x="850" y="136" text-anchor="end">Vow fulfilled</text>
    <text x="460" y="340" text-anchor="middle">git --version exits</text>
    <text x="720" y="340" text-anchor="middle">emacs --version exits</text>
  </g>
</svg>
