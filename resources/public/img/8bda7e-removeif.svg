<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0410d"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" rx="16" fill="#fff"/>
<rect x="330" y="20" width="340" height="48" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="500" y="51" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">(.removeIf l #{1 2})</text>
<line x1="500" y1="68" x2="265" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="265" y="132" font-size="16" fill="#0f4c81" text-anchor="middle" font-weight="bold">l の型が分かる (ArrayList)</text>
<rect x="60" y="150" width="410" height="120" rx="6" fill="#dbe6f4" stroke="#0f4c81" stroke-width="2"/>
<text x="265" y="186" font-size="16" fill="#222" text-anchor="middle">コンパイラが作るアダプタ</text>
<text x="265" y="218" font-size="16" fill="#222" text-anchor="middle">#{1 2} が返す 1 (Long) を</text>
<text x="265" y="250" font-size="16" fill="#222" text-anchor="middle">そのまま Boolean にキャストする</text>
<line x1="265" y1="270" x2="265" y2="320" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="115" y="322" width="300" height="50" rx="6" fill="#fff" stroke="#0f4c81" stroke-width="2"/>
<text x="265" y="353" font-size="17" fill="#0f4c81" text-anchor="middle" font-weight="bold">ClassCastException</text>
<line x1="500" y1="68" x2="735" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="735" y="132" font-size="16" fill="#a0410d" text-anchor="middle" font-weight="bold">l の型が分からない (identity を挟む)</text>
<rect x="530" y="150" width="410" height="120" rx="6" fill="#fde2d2" stroke="#a0410d" stroke-width="2"/>
<text x="735" y="186" font-size="16" fill="#222" text-anchor="middle">Reflector.coerceAdapterReturn</text>
<text x="735" y="218" font-size="16" fill="#222" text-anchor="middle">RT.booleanCast で 1 を真と読む</text>
<text x="735" y="250" font-size="16" fill="#222" text-anchor="middle">(CLJ-2864 で外した処理)</text>
<line x1="735" y1="270" x2="735" y2="320" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="585" y="322" width="300" height="50" rx="6" fill="#fff" stroke="#a0410d" stroke-width="2"/>
<text x="735" y="353" font-size="17" fill="#a0410d" text-anchor="middle" font-weight="bold">1 と 2 を消して [3]</text>
<text x="500" y="412" font-size="16" fill="#666" text-anchor="middle">同じ呼び出しが、型ヒントの有無で別の結果になる</text>
</svg>
