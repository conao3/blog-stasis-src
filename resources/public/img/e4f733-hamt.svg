<text x="140" y="98" font-size="15" fill="#222" text-anchor="middle">root (hash bits 0-4)</text>
<line x1="140" y1="114" x2="140" y2="170" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="150" y="148" font-size="14" fill="#666" text-anchor="start">bits 0-4 = 11</text>
<text x="380" y="40" font-size="18" fill="#222" text-anchor="start" font-weight="bold">② (dissoc [0 42])</text>
<rect x="380" y="70" width="220" height="44" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="490" y="98" font-size="15" fill="#222" text-anchor="middle">root (hash bits 0-4)</text>
<line x1="490" y1="114" x2="490" y2="170" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="500" y="148" font-size="14" fill="#666" text-anchor="start">bits 0-4 = 11</text>
<text x="730" y="40" font-size="18" fill="#222" text-anchor="start" font-weight="bold">③ (assoc a :A2)</text>
<rect x="730" y="70" width="220" height="44" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="840" y="98" font-size="15" fill="#222" text-anchor="middle">root (hash bits 0-4)</text>
<line x1="840" y1="114" x2="840" y2="170" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="850" y="148" font-size="14" fill="#666" text-anchor="start">bits 0-4 = 11</text>
<rect x="35" y="172" width="270" height="118" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<text x="47" y="196" font-size="14" fill="#666" text-anchor="start">HashCollisionNode</text>
<text x="47" y="216" font-size="15" fill="#222" text-anchor="start">stored hash = 1003</text>
<text x="59" y="244" font-size="16" fill="#222" text-anchor="start">a = [0 42] → :A</text>
<text x="59" y="274" font-size="16" fill="#222" text-anchor="start">b = [1 11] → :B</text>
<rect x="385" y="172" width="270" height="88" rx="6" fill="#fde2d2" stroke="#a0410d" stroke-width="2"/>
<text x="397" y="196" font-size="14" fill="#666" text-anchor="start">HashCollisionNode</text>
<text x="397" y="216" font-size="15" fill="#a0410d" text-anchor="start" font-weight="bold">stored hash = 1867155179</text>
<text x="409" y="244" font-size="16" fill="#222" text-anchor="start">b = [1 11] → :B</text>
<text x="385" y="310" font-size="15" fill="#a0410d" text-anchor="start">should stay 1003;</text>
<text x="385" y="332" font-size="15" fill="#a0410d" text-anchor="start">it holds the hash of [0 42]</text>
<rect x="735" y="172" width="300" height="44" rx="6" fill="#e5e7eb" stroke="#bbb" stroke-width="1.5"/>
<text x="885" y="200" font-size="15" fill="#222" text-anchor="middle">BitmapIndexedNode (bits 5-9)</text>
<line x1="810" y1="216" x2="790" y2="280" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="690" y="256" font-size="14" fill="#666" text-anchor="start">bits 5-9 = 23</text>
<line x1="960" y1="216" x2="980" y2="280" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="980" y="256" font-size="14" fill="#666" text-anchor="start">bits 5-9 = 31</text>
<rect x="725" y="282" width="175" height="96" rx="6" fill="#fde2d2" stroke="#a0410d" stroke-width="2"/>
<text x="735" y="304" font-size="13" fill="#666" text-anchor="start">HashCollisionNode</text>
<text x="735" y="326" font-size="14" fill="#a0410d" text-anchor="start" font-weight="bold">stored 1867155179</text>
<text x="745" y="358" font-size="16" fill="#222" text-anchor="start">b → :B</text>
<rect x="920" y="282" width="120" height="60" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<text x="980" y="318" font-size="16" fill="#222" text-anchor="middle">a → :A2</text>
<rect x="20" y="402" width="1040" height="90" rx="10" fill="#fff8f3" stroke="#a0410d" stroke-width="1.5"/>
<text x="40" y="430" font-size="16" fill="#a0410d" text-anchor="start" font-weight="bold">(get m3 b): b's hash 1003 has 11 in bits 0-4 and 31 in bits 5-9, so get follows branch 31</text>
<text x="40" y="460" font-size="16" fill="#a0410d" text-anchor="start">Branch 31 holds only a, so get returns nil. b sits in branch 23 under the hash 1867155179.</text>
</svg>
