<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" font-family="sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0410d"/></marker></defs>
<rect x="0" y="0" width="1080" height="520" rx="16" fill="#fff"/>
<text x="30" y="40" font-size="18" fill="#222" text-anchor="start" font-weight="bold">① (hash-map a :A b :B)</text>
