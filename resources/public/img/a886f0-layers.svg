<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="534" viewBox="0 0 1000 534" font-family="sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="534" rx="16" fill="#fff"/>
  <text x="30" y="44" font-size="20" font-weight="bold" fill="#222">leangageの層</text>

  <rect x="30" y="70" width="270" height="354" rx="12" fill="#e8eef7" stroke="#0f4c81" stroke-width="2"/>
  <text x="165" y="104" font-size="20" text-anchor="middle" font-weight="bold" fill="#0f4c81">Lean 4</text>
  <text x="165" y="136" font-size="16" text-anchor="middle" fill="#222">kernel (transition)</text>
  <text x="165" y="162" font-size="16" text-anchor="middle" fill="#222">要求を命令に直す関数</text>
  <text x="165" y="188" font-size="16" text-anchor="middle" fill="#222">結果を返信に直す関数</text>
  <text x="165" y="214" font-size="16" text-anchor="middle" fill="#222">PostgreSQLの表の定義</text>
  <text x="165" y="240" font-size="16" text-anchor="middle" fill="#222">認可のguard</text>
  <text x="165" y="266" font-size="16" text-anchor="middle" fill="#222">SQLのコンパイラ</text>
  <text x="165" y="292" font-size="16" text-anchor="middle" fill="#222">bearer tokenの形式</text>
  <text x="165" y="318" font-size="16" text-anchor="middle" fill="#222">認証と失敗の返信を決める関数</text>
  <text x="165" y="344" font-size="16" text-anchor="middle" fill="#222">JSONのトークンを扱う関数</text>
  <text x="165" y="370" font-size="16" text-anchor="middle" fill="#222">JSONを書く関数</text>
  <text x="165" y="400" font-size="16" text-anchor="middle" font-weight="bold" fill="#0f4c81">と、それぞれの定理</text>

  <line x1="305" y1="247" x2="395" y2="247" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="350" y="234" font-size="16" text-anchor="middle" fill="#222">leanfran</text>

  <rect x="400" y="70" width="270" height="354" rx="12" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
  <text x="535" y="104" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">サーバー (手で書く)</text>
  <text x="535" y="134" font-size="16" text-anchor="middle" fill="#222">HTTP、JSON、署名、保存</text>
  <rect x="425" y="178" width="220" height="198" rx="10" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
  <text x="535" y="216" font-size="18" text-anchor="middle" font-weight="bold" fill="#b36b00">変換したコード</text>
  <text x="535" y="262" font-size="16" text-anchor="middle" fill="#222">Rust</text>
  <text x="535" y="300" font-size="16" text-anchor="middle" fill="#222">Python</text>
  <text x="535" y="338" font-size="16" text-anchor="middle" fill="#222">Go</text>

  <line x1="675" y1="247" x2="765" y2="247" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="720" y="234" font-size="16" text-anchor="middle" fill="#222">状態</text>

  <rect x="770" y="70" width="200" height="354" rx="12" fill="#e6f1ea" stroke="#2f6f4f" stroke-width="2"/>
  <text x="870" y="104" font-size="20" text-anchor="middle" font-weight="bold" fill="#2f6f4f">保存先</text>
  <text x="870" y="232" font-size="16" text-anchor="middle" fill="#222">メモリ</text>
  <text x="870" y="268" font-size="16" text-anchor="middle" fill="#222">PostgreSQL</text>

  <rect x="30" y="450" width="270" height="54" rx="10" fill="#0f4c81"/>
  <text x="165" y="483" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">Leanで証明する</text>
  <rect x="425" y="450" width="220" height="54" rx="10" fill="#b36b00"/>
  <text x="535" y="483" font-size="16" text-anchor="middle" font-weight="bold" fill="#fff">leanfranで変換する</text>
  <rect x="770" y="450" width="200" height="54" rx="10" fill="#555"/>
  <text x="870" y="483" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">サーバーと保存先は証明の外</text>
</svg>
