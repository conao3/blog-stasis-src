<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 750" width="830" height="750" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="830" height="750" rx="8" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="170" y="20" width="590" height="96"/>
    <rect x="170" y="160" width="590" height="288"/>
    <rect x="170" y="490" width="590" height="84"/>
    <rect x="170" y="618" width="590" height="108" stroke-dasharray="8 5"/>
  </g>
  <g fill="#eee" stroke="#000" stroke-width="1.5">
    <rect x="170" y="20" width="104" height="30"/>
    <rect x="170" y="160" width="160" height="30"/>
    <rect x="170" y="490" width="104" height="30"/>
    <rect x="170" y="618" width="130" height="30" stroke-dasharray="6 4"/>
  </g>
  <g fill="#000">
    <text x="179" y="41">[remotes]</text>
    <text x="179" y="181">[remote "self"]</text>
    <text x="179" y="511">[include]</text>
    <text x="179" y="639">.git/refs/H/</text>
  </g>
  <g fill="#000">
    <text x="190" y="76" font-weight="bold">loop = <tspan fill="#d63a22">self</tspan></text>
    <text x="190" y="100" font-weight="bold">loop = <tspan fill="#d63a22">loop</tspan></text>
    <text y="216"><tspan x="190">url</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">.</tspan></text>
    <text y="240"><tspan x="190">prune</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">true</tspan></text>
    <text y="264"><tspan x="190">tagOpt</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">--no-tags</tspan></text>
    <text y="288"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/B/*:refs/A/*</tspan></text>
    <text y="312"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/A/s1xa*:refs/B/s2x*</tspan></text>
    <text y="336"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/A/s1xy*:refs/B/sHxy*</tspan></text>
    <text y="360"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/A/s2x*z:refs/B/s3x*bz</tspan></text>
    <text y="384"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/A/s3x*z:refs/B/s1x*bz</tspan></text>
    <text y="408"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/A/sHx*:refs/B/sHx*</tspan></text>
    <text y="432" font-weight="bold"><tspan x="190">fetch</tspan><tspan x="253">= </tspan><tspan fill="#d63a22">+refs/A/sHx*:refs/H/*</tspan></text>
    <text x="190" y="546" font-weight="bold">path = <tspan fill="#d63a22">refs/H</tspan></text>
    <text x="190" y="674" fill="#666">created by the halt refspec; the include now hits it:</text>
    <text x="190" y="698" fill="#d63a22">fatal: bad config line 24 in file .git/config</text>
  </g>
  <g fill="#666" font-size="13" text-anchor="end">
    <text x="160" y="288">copy back</text>
    <text x="160" y="312">1: a &gt; 0</text>
    <text x="160" y="336">1: a == 0</text>
    <text x="160" y="360">2: inc b</text>
    <text x="160" y="384">3: inc b</text>
    <text x="160" y="408">H: stay</text>
    <text x="160" y="432">H: halt</text>
  </g>
  <g fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)">
    <path d="M170,71 H60 V175 H168"/>
    <path d="M760,95 H795 V35 H762"/>
    <path d="M760,427 H795 V633 H762"/>
    <path d="M170,541 H60 V633 H168"/>
  </g>
  <g fill="#000" font-size="13">
    <text x="68" y="130">fetch self</text>
    <text x="812" y="65" transform="rotate(90 812 65)">new git fetch</text>
    <text x="68" y="600">read config</text>
  </g>
</svg>
