<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986 894" width="986" height="894" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="986" height="894" rx="8" fill="#fff"/>
  <rect x="214" y="20" width="686" height="116" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="214" y="20" width="124.6" height="38" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="225" y="46">[remotes]</text>
  <text y="92" font-weight="bold"><tspan x="236">loop</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">self</tspan></text>
  <text y="122" font-weight="bold"><tspan x="236">loop</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">loop</tspan></text>
  <rect x="214" y="186" width="686" height="356" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="214" y="186" width="193" height="38" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="225" y="212">[remote "self"]</text>
  <text y="258"><tspan x="236">url</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">.</tspan></text>
  <text y="288"><tspan x="236">prune</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">true</tspan></text>
  <text y="318"><tspan x="236">tagOpt</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">--no-tags</tspan></text>
  <text y="348"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/B/*:refs/A/*</tspan></text>
  <text x="200" y="348" fill="#555" text-anchor="end">copy back</text>
  <text y="378"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/A/s1xa*:refs/B/s2x*</tspan></text>
  <text x="200" y="378" fill="#555" text-anchor="end">1: a &gt; 0</text>
  <text y="408"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/A/s1xy*:refs/B/sHxy*</tspan></text>
  <text x="200" y="408" fill="#555" text-anchor="end">1: a == 0</text>
  <text y="438"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/A/s2x*z:refs/B/s3x*bz</tspan></text>
  <text x="200" y="438" fill="#555" text-anchor="end">2: inc b</text>
  <text y="468"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/A/s3x*z:refs/B/s1x*bz</tspan></text>
  <text x="200" y="468" fill="#555" text-anchor="end">3: inc b</text>
  <text y="498"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/A/sHx*:refs/B/sHx*</tspan></text>
  <text x="200" y="498" fill="#555" text-anchor="end">H: stay</text>
  <text y="528" font-weight="bold"><tspan x="236">fetch</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">+refs/A/sHx*:refs/H/*</tspan></text>
  <text x="200" y="528" fill="#555" text-anchor="end">H: halt</text>
  <rect x="214" y="592" width="686" height="86" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="214" y="592" width="124.6" height="38" fill="#eee" stroke="#000" stroke-width="1.5"/>
  <text x="225" y="618">[include]</text>
  <text y="664" font-weight="bold"><tspan x="236">path</tspan><tspan x="327.2">= </tspan><tspan fill="#d63a22">refs/H</tspan></text>
  <rect x="214" y="728" width="686" height="146" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="214" y="728" width="158.8" height="38" fill="#eee" stroke="#000" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="225" y="754">.git/refs/H/</text>
  <text x="236" y="800" fill="#555">created by the halt refspec;</text>
  <text x="236" y="830" fill="#555">the include now hits it:</text>
  <text x="236" y="860" fill="#d63a22">fatal: bad config line 24 in file .git/config</text>
  <path d="M214,86 H64 V205.0 H212" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="76" y="159">fetch self</text>
  <path d="M900,116 H936 V39.0 H902" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="50" text-anchor="start" transform="rotate(90 960 50)">new git fetch</text>
  <path d="M900,522 H936 V747.0 H902" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M214,658 H64 V747.0 H212" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="76" y="722">read config</text>
</svg>
