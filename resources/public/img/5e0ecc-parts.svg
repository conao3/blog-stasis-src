<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="Noto Sans JP, sans-serif">
<style>
.t{fill:#1f2328;font-size:14px;font-weight:600}
.s{fill:#59636e;font-size:12px}
.box{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.ext{fill:#fff;stroke:#818b98;stroke-width:1.5}
.chk{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.frame{fill:none;stroke:#0969da;stroke-width:1.5;stroke-dasharray:6 4}
.a{stroke:#0969da;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.ao{stroke:#818b98;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#aho)}
.mh{fill:#0969da}.mho{fill:#818b98}
</style>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path class="mh" d="M0,0 L9,4.5 L0,9 z"/></marker>
<marker id="aho" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path class="mho" d="M0,0 L9,4.5 L0,9 z"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="400" rx="14" fill="#fff"/>
<rect class="ext" x="15" y="150" width="210" height="70" rx="6"/>
<text class="t" x="120" y="180" text-anchor="middle">Human</text>
<text class="s" x="120" y="202" text-anchor="middle">Requests, specifications, decisions</text>
<rect class="box" x="275" y="150" width="176" height="70" rx="6"/>
<text class="t" x="363" y="180" text-anchor="middle">Work queue</text>
<text class="s" x="363" y="202" text-anchor="middle">Tasks, states, dependencies</text>
<rect class="box" x="501" y="150" width="172" height="70" rx="6"/>
<text class="t" x="587" y="180" text-anchor="middle">Exclusivity</text>
<text class="s" x="587" y="202" text-anchor="middle">Each item to one agent only</text>
<rect class="frame" x="723" y="40" width="170" height="290" rx="8"/>
<text class="s" x="808" y="62" text-anchor="middle">Separate workspaces</text>
<rect class="box" x="743" y="76" width="130" height="62" rx="6"/>
<text class="t" x="808" y="103" text-anchor="middle">Agent</text>
<text class="s" x="808" y="123" text-anchor="middle">Workspace 1</text>
<rect class="box" x="743" y="154" width="130" height="62" rx="6"/>
<text class="t" x="808" y="181" text-anchor="middle">Agent</text>
<text class="s" x="808" y="201" text-anchor="middle">Workspace 2</text>
<rect class="box" x="743" y="232" width="130" height="62" rx="6"/>
<text class="t" x="808" y="259" text-anchor="middle">Agent</text>
<text class="s" x="808" y="279" text-anchor="middle">Workspace 3</text>
<rect class="chk" x="935" y="150" width="150" height="70" rx="6"/>
<text class="t" x="1010" y="180" text-anchor="middle">Checks</text>
<text class="s" x="1010" y="202" text-anchor="middle">Tests, lints, reviews</text>
<path class="a" d="M225,185 L273,185"/>
<path class="a" d="M451,185 L499,185"/>
<path class="a" d="M673,185 L721,185"/>
<path class="a" d="M893,185 L933,185"/>
<path class="ao" d="M1010,220 L1010,365 L363,365 L363,222"/>
<text class="s" x="686" y="357" text-anchor="middle">Work that fails the checks and tasks lent past their time limit go back to the queue</text>
<path class="ao" d="M808,40 L808,18 L120,18 L120,148"/>
<text class="s" x="464" y="34" text-anchor="middle">Call a human only when a decision is needed</text>
</svg>
