<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" font-family="'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="400" rx="16" fill="#fff"/>
  <rect x="20" y="150" width="210" height="120" rx="12" fill="#eef3fb" stroke="#5b7fb8"/>
  <text x="125" y="200" font-size="21" font-weight="bold" fill="#333" text-anchor="middle">Source text</text>
  <text x="125" y="234" font-size="19" fill="#333" text-anchor="middle">--text / standard input</text>
  <rect x="280" y="110" width="560" height="200" rx="12" fill="#f4f6f8" stroke="#8a96a3" stroke-dasharray="6 4"/>
  <text x="300" y="146" font-size="21" font-weight="bold" fill="#333">plamo-tr-local (your PC)</text>
  <rect x="300" y="170" width="240" height="110" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="420" y="212" font-size="19" fill="#333" text-anchor="middle">Split into paragraphs,</text>
  <text x="420" y="244" font-size="19" fill="#333" text-anchor="middle">build the PFML3 prompt</text>
  <rect x="580" y="170" width="240" height="110" rx="10" fill="#fff" stroke="#8a96a3"/>
  <text x="700" y="212" font-size="19" fill="#333" text-anchor="middle">Generate the translation</text>
  <text x="700" y="244" font-size="19" fill="#333" text-anchor="middle">with llama.cpp</text>
  <line x1="540" y1="225" x2="576" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="890" y="150" width="190" height="120" rx="12" fill="#eef8f1" stroke="#4f9a68"/>
  <text x="985" y="200" font-size="21" font-weight="bold" fill="#333" text-anchor="middle">Translation</text>
  <text x="985" y="234" font-size="19" fill="#333" text-anchor="middle">JSON</text>
  <line x1="230" y1="210" x2="276" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="210" x2="886" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="495" y="20" width="410" height="60" rx="10" fill="#fdf5e8" stroke="#c48a2c"/>
  <text x="700" y="58" font-size="19" fill="#333" text-anchor="middle">Hugging Face (GGUF Q4_K_M)</text>
  <line x1="700" y1="80" x2="700" y2="166" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="715" y="102" font-size="19" fill="#555">Cached on the first run</text>
  <text x="550" y="350" font-size="19" fill="#555" text-anchor="middle">You need no account or API key, and your text stays on your PC.</text>
