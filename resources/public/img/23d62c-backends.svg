<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" rx="16" fill="white"/>
<defs>
<marker id="forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#276749" stroke-width="1.5"/></marker>
<marker id="reverse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#285ea8" stroke-width="1.5"/></marker>
</defs>
<g font-family="sans-serif" fill="#172b4d">
<text x="20" y="46" font-size="30" font-weight="bold">Leanで証明した関数を、普段の言語で使う</text>
<rect x="20" y="80" width="250" height="210" rx="12" fill="#e7f0ff"/>
<rect x="325" y="80" width="250" height="210" rx="12" fill="#e1f5ed"/>
<rect x="630" y="80" width="250" height="210" rx="12" fill="#eef1f5"/>
<g text-anchor="middle">
<text x="145" y="143" font-size="32" font-weight="bold">Lean 4</text>
<text x="145" y="204" font-size="26">関数と性質の証明</text>
<text x="450" y="143" font-size="32" font-weight="bold">leanfran</text>
<text x="450" y="199" font-size="26">中間表現から</text>
<text x="450" y="237" font-size="26">コード生成</text>
<text x="755" y="136" font-size="26">Rust / Python</text>
<text x="755" y="176" font-size="26">TypeScript / Clojure</text>
<text x="755" y="237" font-size="26">アプリから呼び出す</text>
</g>
<text x="20" y="360" font-size="30" font-weight="bold">普段の言語で書いた関数を、Leanで検証する</text>
<rect x="20" y="390" width="250" height="230" rx="12" fill="#e7f0ff"/>
<rect x="325" y="390" width="250" height="230" rx="12" fill="#e1f5ed"/>
<rect x="630" y="390" width="250" height="230" rx="12" fill="#eef1f5"/>
<g text-anchor="middle">
<text x="145" y="450" font-size="32" font-weight="bold">Lean 4</text>
<text x="145" y="511" font-size="26">翻訳したモデル</text>
<text x="145" y="551" font-size="26">性質を証明する</text>
<text x="450" y="450" font-size="32" font-weight="bold">leanfran</text>
<text x="450" y="500" font-size="26">対応する関数を翻訳</text>
<text x="450" y="545" font-size="26">RustはCharon</text>
<text x="450" y="580" font-size="26">+ Aeneas</text>
<text x="755" y="450" font-size="26">Rust / Python</text>
<text x="755" y="490" font-size="26">TypeScript / Clojure</text>
<text x="755" y="551" font-size="26">各言語で書いた関数</text>
</g>
</g>
