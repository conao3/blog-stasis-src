<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Noto Sans, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1100" height="600" rx="16" fill="#ffffff"/>
<text x="320" y="52" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">Build time</text>
<text x="870" y="52" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">Run time</text>
<line x1="640" y1="30" x2="640" y2="575" stroke="#bbb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="20" y="100" font-size="20" font-weight="bold" fill="#d9622b">API calls</text>
<rect x="20" y="120" width="170" height="100" rx="10" fill="#ececec" stroke="#888" stroke-width="2"/>
<text x="105.0" y="163.0" font-size="19" text-anchor="middle" fill="#222">botocore</text>
<text x="105.0" y="191.0" font-size="19" text-anchor="middle" fill="#222">models (JSON)</text>
<rect x="235" y="120" width="170" height="100" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="320.0" y="163.0" font-size="19" text-anchor="middle" fill="#222">Convert to a</text>
<text x="320.0" y="191.0" font-size="19" text-anchor="middle" fill="#222">form read in place</text>
<rect x="450" y="120" width="170" height="100" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="535.0" y="163.0" font-size="19" text-anchor="middle" fill="#222">Embed</text>
<text x="535.0" y="191.0" font-size="19" text-anchor="middle" fill="#222">uncompressed</text>
<line x1="190" y1="170" x2="233" y2="170" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="405" y1="170" x2="448" y2="170" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="620" y1="170" x2="683" y2="170" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="685" y="120" width="395" height="100" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="882.5" y="163.0" font-size="19" text-anchor="middle" fill="#222">Read only the operation and</text>
<text x="882.5" y="191.0" font-size="19" text-anchor="middle" fill="#222">shapes in use (no JSON parsing)</text>
<text x="20" y="300" font-size="20" font-weight="bold" fill="#d9622b">Help pages</text>
<rect x="20" y="320" width="170" height="100" rx="10" fill="#ececec" stroke="#888" stroke-width="2"/>
<text x="105.0" y="363.0" font-size="19" text-anchor="middle" fill="#222">Help inputs</text>
<text x="105.0" y="391.0" font-size="19" text-anchor="middle" fill="#222">20,448 pages</text>
<rect x="235" y="320" width="170" height="100" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="320.0" y="363.0" font-size="19" text-anchor="middle" fill="#222">Format</text>
<text x="320.0" y="391.0" font-size="19" text-anchor="middle" fill="#222">with groff</text>
<rect x="450" y="320" width="170" height="100" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="535.0" y="349.0" font-size="19" text-anchor="middle" fill="#222">Compress with a</text>
<text x="535.0" y="377.0" font-size="19" text-anchor="middle" fill="#222">zstd dictionary</text>
<text x="535.0" y="405.0" font-size="19" text-anchor="middle" fill="#222">and embed</text>
<line x1="190" y1="370" x2="233" y2="370" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="405" y1="370" x2="448" y2="370" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="620" y1="370" x2="683" y2="370" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="685" y="320" width="395" height="100" rx="10" fill="#fbe3d6" stroke="#d9622b" stroke-width="2"/>
<text x="882.5" y="363.0" font-size="19" text-anchor="middle" fill="#222">Same groff version: decompress</text>
<text x="882.5" y="391.0" font-size="19" text-anchor="middle" fill="#222">and print without groff</text>
<line x1="882" y1="420" x2="882" y2="463" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="685" y="465" width="395" height="100" rx="10" fill="#ffffff" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/>
<text x="882.5" y="508.0" font-size="19" text-anchor="middle" fill="#222">Other version: format with the</text>
<text x="882.5" y="536.0" font-size="19" text-anchor="middle" fill="#222">local groff and cache the result</text>
</svg>
